services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: csn_ecommerce_app
        restart: unless-stopped
        working_dir: /var/www
        env_file: .env
        environment:
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE:-csn_ecommerce}'
            DB_USERNAME: '${DB_USERNAME:-root}'
            DB_PASSWORD: '${DB_PASSWORD:-secret}'
            APP_URL: '${APP_URL:-http://localhost}'
            APP_KEY: '${APP_KEY:-base64:Pvl0ChyexDup2hSVje288OleDelaZceNaJFasFLxrXQ=}'
            RUN_MIGRATIONS: '${RUN_MIGRATIONS:-true}'
            RUN_SEEDER: '${RUN_SEEDER:-true}'
        volumes:
            - .:/var/www
            - app_storage:/var/www/storage
        depends_on:
            - db
        networks:
            - csn_ecommerce_network

    db:
        image: mysql:8.0
        container_name: csn_ecommerce_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_DATABASE: '${DB_DATABASE:-csn_ecommerce}'
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - csn_ecommerce_network

    nginx:
        image: nginx:alpine
        container_name: csn_ecommerce_nginx
        restart: unless-stopped
        ports:
            - '${FORWARD_HTTP_PORT:-80}:80'
            - '${FORWARD_HTTPS_PORT:-443}:443'
        volumes:
            - .:/var/www
            - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/certbot/conf:/etc/letsencrypt:ro
            - ./docker/certbot/www:/var/www/certbot:ro
            - app_storage:/var/www/storage
        depends_on:
            - app
        networks:
            - csn_ecommerce_network

    certbot:
        image: certbot/certbot
        container_name: csn_ecommerce_certbot
        restart: unless-stopped
        volumes:
            - ./docker/certbot/conf:/etc/letsencrypt
            - ./docker/certbot/www:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
        networks:
            - csn_ecommerce_network

